<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blood Strike LATAM - Revelación</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-main: #07090e;
      --card-bg: #0d111a;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0055;
      --radius-ui: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: absolute; inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .flash-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 70%);
      opacity: 0; pointer-events: none; z-index: 50;
      transition: opacity 0.5s ease;
    }
    .flash-overlay.active { opacity: 1; }

    #burstCanvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

    .app-container {
      width: 100%; max-width: 440px; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      z-index: 10; margin: 0 auto;
    }

    .header-ui { text-align: center; width: 100%; margin-top: 5px; }
    .tag {
      font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 3px; color: var(--accent-cyan); text-transform: uppercase;
      opacity: 0.9; display: block; margin-bottom: 6px;
    }

    .creator-title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px;
    }

    .status-banner {
      position: absolute; top: 4%; left: 0; width: 100%; text-align: center;
      opacity: 0; transform: translateY(-20px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 30; padding: 0 15px;
    }
    .status-banner.show { opacity: 1; transform: translateY(0) scale(1); }
    .banner-badge {
      font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; display: block;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .banner-title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 900; color: #ffffff; text-transform: uppercase; text-shadow: 0 0 25px rgba(0,240,255,0.6);
    }

    .stage { perspective: 1200px; width: 100%; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
    .card-wrapper {
      width: clamp(220px, 45vh, 270px); aspect-ratio: 1 / 1.55; position: relative;
      transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatSmooth 4s ease-in-out infinite;
    }
    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotateX(4deg) rotateY(-2deg); }
      50% { transform: translateY(-10px) rotateX(-4deg) rotateY(2deg); }
    }
    .card-wrapper.flipped {
      animation: floatFlipped 4s ease-in-out infinite 1.2s !important;
      transform: scale(1.05) rotateY(180deg) !important;
    }
    @keyframes floatFlipped {
      0%, 100% { transform: scale(1.05) rotateY(180deg) translateY(0px); }
      50% { transform: scale(1.05) rotateY(184deg) translateY(-8px); }
    }

    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius-ui);
      overflow: hidden; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15); background: var(--card-bg);
    }
    .card-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-back { transform: rotateY(0deg); }
    .card-front { transform: rotateY(180deg); }

    .vote-ui {
      width: 100%; background: rgba(13, 17, 26, 0.75); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-ui);
      padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); margin-bottom: 5px;
      transition: opacity 0.4s ease;
    }
    .progress-info { display: flex; flex-direction: column; gap: 6px; }
    .votes-display {
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; color: #94a3b8;
    }
    .votes-highlight { font-size: 1.2rem; color: var(--accent-cyan); font-weight: 900; }
    .progress-bar-bg { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink)); border-radius: 10px; transition: width 0.3s ease; }

    .btn-vote {
      width: 100%; background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #07090e; border: none; font-family: 'Orbitron', sans-serif; font-size: 1rem;
      font-weight: 900; letter-spacing: 1.5px; padding: 13px; border-radius: 12px;
      cursor: pointer; text-transform: uppercase; transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(0, 240, 255, 0.35);
    }
    .btn-vote:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-vote:active { transform: scale(0.98); }
    .btn-vote:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }

    .fade-out { opacity: 0 !important; pointer-events: none !important; }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div id="flashOverlay" class="flash-overlay"></div>
  <canvas id="burstCanvas"></canvas>

  <div id="successBanner" class="status-banner">
    <span class="banner-badge">● META ALCANZADA (500/500) ●</span>
    <h1 class="banner-title" id="bannerCreatorName">JHODA HA RESPONDIDO</h1>
  </div>

  <div class="app-container">
    <header class="header-ui">
      <span class="tag">BLOOD STRIKE LATAM</span>
      <h2 id="creatorTitle" class="creator-title">CARGANDO...</h2>
    </header>

    <div class="stage">
      <div id="cardWrapper" class="card-wrapper">
        <div class="card-face card-back">
          <img id="cardBackImg" src="1000013129.png" alt="Card Back">
        </div>
        <div class="card-face card-front">
          <img id="cardFrontImg" src="1000013137.png" alt="Card Front">
        </div>
      </div>
    </div>

    <div id="voteUI" class="vote-ui">
      <div class="progress-info">
        <div class="votes-display">
          <span>META DE COMUNIDAD</span>
          <span><strong id="currentVotes" class="votes-highlight">0</strong> / 500</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
      <button id="btnVote" class="btn-vote" onclick="emitVote()">VOTAR AHORA</button>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TUS DATOS REALES DE FIREBASE
      const firebaseConfig = {
  apiKey: "AIzaSyC-a1OGET1bsfBQdsFBomwvOaPgpmC-0bQ",
  authDomain: "gestor-creadores-rrss.firebaseapp.com",
  projectId: "gestor-creadores-rrss",
  storageBucket: "gestor-creadores-rrss.firebasestorage.app",
  messagingSenderId: "181748634176",
  appId: "1:181748634176:web:bd0bc887c0f976b43d05a5",
  measurementId: "G-9744QBXJKH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const targetVotes = 500;

    // Generar o recuperar ID de usuario único por navegador (para evitar doble voto)
    let userId = localStorage.getItem('bs_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substring(2) + Date.now();
      localStorage.setItem('bs_user_id', userId);
    }

    const docRef = db.collection("creators").doc("current_config");

    // Escuchar cambios en tiempo real desde Firestore
    docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        
        document.getElementById('creatorTitle').innerText = data.creatorName || "CREADOR";
        document.getElementById('bannerCreatorName').innerText = `${data.creatorName || "CREADOR"} HA RESPONDIDO`;
        document.getElementById('cardFrontImg').src = data.frontImg || "1000013137.png";
        document.getElementById('cardBackImg').src = data.backImg || "1000013129.png";

        const currentVotes = data.votes || 0;
        document.getElementById('currentVotes').innerText = currentVotes;
        const pct = (currentVotes / targetVotes) * 100;
        document.getElementById('progressBar').style.width = pct + '%';

        // Validar si el usuario actual ya se encuentra en el arreglo de votantes
        if (data.voters && data.voters.includes(userId)) {
          lockButton("¡YA HAS VOTADO!");
        }

        if (data.completed || currentVotes >= targetVotes) {
          triggerSuccessVisuals();
        }
      }
    });

    async function emitVote() {
      const btn = document.getElementById('btnVote');
      btn.disabled = true;

      try {
        await db.runTransaction(async (transaction) => {
          const snapshot = await transaction.get(docRef);
          if (!snapshot.exists) throw "¡El documento no existe!";

          const data = snapshot.data();
          const voters = data.voters || [];
          let votes = data.votes || 0;

          if (voters.includes(userId)) {
            throw "Ya registraste tu voto anteriormente.";
          }

          if (votes >= targetVotes) {
            throw "La meta ya ha sido completada.";
          }

          voters.push(userId);
          votes += 1;
          const completed = votes >= targetVotes;

          transaction.update(docRef, {
            votes: votes,
            voters: voters,
            completed: completed
          });
        });

        lockButton("¡YA HAS VOTADO!");
      } catch (err) {
        console.error("Error al votar:", err);
        alert(typeof err === 'string' ? err : "Ocurrió un error al registrar tu voto.");
        btn.disabled = false;
      }
    }

    function lockButton(text) {
      const btn = document.getElementById('btnVote');
      btn.innerText = text;
      btn.disabled = true;
    }

    function triggerSuccessVisuals() {
      document.getElementById('voteUI').classList.add('fade-out');
      const flash = document.getElementById('flashOverlay');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 500);

      triggerParticleBurst();
      setTimeout(() => {
        document.getElementById('cardWrapper').classList.add('flipped');
      }, 250);
      setTimeout(() => {
        document.getElementById('successBanner').classList.add('show');
      }, 600);
    }

    // Partículas de éxito
    const canvas = document.getElementById('burstCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticleBurst() {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2, speed = Math.random() * 7 + 2;
        particles.push({
          x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 1, color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055',
          alpha: 1, decay: Math.random() * 0.02 + 0.015
        });
      }
      animateBurst();
    }

    function animateBurst() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
        if (p.alpha > 0) {
          ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        } else { particles.splice(index, 1); }
      });
      if (particles.length > 0) requestAnimationFrame(animateBurst);
    }
  </script>
</body>
</html>
