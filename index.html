<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Strike LATAM - Revelación de Creador</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Orbitron', sans-serif; }
        body { background-color: #050508; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow-x: hidden; padding: 20px; }
        .header { text-align: center; margin-top: 10px; }
        .header h3 { font-size: 0.8rem; color: #ff0055; letter-spacing: 3px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
        .header h1 { font-size: 1.5rem; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(0,243,255,0.4); }
        
        .timer-container { background: rgba(15, 15, 25, 0.9); border: 1px solid #ff0055; padding: 8px 20px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; letter-spacing: 2px; color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.2); }

        .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 400px; flex: 1; margin: 20px 0; }
        
        .card-container { width: 260px; height: 380px; perspective: 1000px; margin-bottom: 20px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; overflow: hidden; border: 2px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 25px rgba(0, 243, 255, 0.15); background: #0b0b14; }
        .card-face img { width: 100%; height: 100%; object-fit: cover; }
        .card-back { transform: rotateY(180deg); border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.2); }

        .voting-panel { width: 100%; background: rgba(15, 15, 25, 0.95); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .meta-info { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; color: #8a8ab0; letter-spacing: 1px; }
        .meta-info span:last-child { color: #00f3ff; font-weight: bold; }
        
        .progress-bar-bg { width: 100%; height: 10px; background: #1a1a2e; border-radius: 5px; overflow: hidden; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0055, #00f3ff); transition: width 0.5s ease; box-shadow: 0 0 10px #00f3ff; }

        .vote-btn { width: 100%; background: linear-gradient(135deg, #ff0055, #990033); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
        .vote-btn:active { transform: scale(0.98); }
        .vote-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; border: 1px solid #444; }

        .status-msg { font-size: 0.75rem; color: #ff3366; margin-top: 10px; min-height: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header">
        <h3>BLOOD STRIKE LATAM</h3>
        <h1>REVELACIÓN DE CREADOR</h1>
    </div>

    <div class="timer-container" id="timerDisplay">TIEMPO RESTANTE: --:--:--</div>

    <div class="main-container">
        <div class="card-container">
            <div class="card" id="creatorCard">
                <div class="card-face card-front">
                    <img id="frontImg" src="" alt="Frente de Carta">
                </div>
                <div class="card-face card-back">
                    <img id="backImg" src="" alt="Dorso de Carta">
                </div>
            </div>
        </div>

        <div class="voting-panel">
            <div class="meta-info">
                <span>META DE COMUNIDAD</span>
                <span id="voteCountText">0 / 500</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <button class="vote-btn" id="voteBtn" onclick="handleVote()">VOTAR AHORA</button>
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyC-a1OGET1bsfBQdsFBomwvOaPgpmC-0bQ",
  authDomain: "gestor-creadores-rrss.firebaseapp.com",
  projectId: "gestor-creadores-rrss",
  storageBucket: "gestor-creadores-rrss.firebasestorage.app",
  messagingSenderId: "181748634176",
  appId: "1:181748634176:web:bd0bc887c0f976b43d05a5",
  measurementId: "G-9744QBXJKH"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection("creators").doc("current_config");

        let userId = localStorage.getItem("bs_voter_id");
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem("bs_voter_id", userId);
        }

        let targetEndTime = 0;
        let eventActive = true;

        // Cronómetro basado en el tiempo configurado en Firebase
        function updateTimer() {
            if (!targetEndTime) return;
            const now = new Date().getTime();
            const distance = targetEndTime - now;

            if (distance < 0) {
                document.getElementById("timerDisplay").innerText = "TIEMPO EXPIRADO";
                document.getElementById("voteBtn").disabled = true;
                document.getElementById("voteBtn").innerText = "EVENTO FINALIZADO";
                eventActive = false;
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("timerDisplay").innerText = 
                `TIEMPO RESTANTE: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        setInterval(updateTimer, 1000);

        docRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById("frontImg").src = data.frontImg || "";
                document.getElementById("backImg").src = data.backImg || "";
                
                const votes = data.votes || 0;
                const completed = data.completed || false;
                const voters = data.voters || [];
                targetEndTime = data.endTime || (new Date().getTime() + 300000);

                document.getElementById("voteCountText").innerText = `${votes} / 500`;
                const percentage = Math.min((votes / 500) * 100, 100);
                document.getElementById("progressBar").style.width = `${percentage}%`;

                const card = document.getElementById("creatorCard");
                const voteBtn = document.getElementById("voteBtn");

                if (completed || votes >= 500) {
                    if (!card.classList.contains("flipped")) {
                        card.classList.add("flipped");
                        triggerConfetti();
                    }
                    voteBtn.disabled = true;
                    voteBtn.innerText = "¡META ALCANZADA!";
                    document.getElementById("statusMsg").innerText = "¡La carta ha sido revelada con éxito!";
                } else if (voters.includes(userId)) {
                    voteBtn.disabled = true;
                    voteBtn.innerText = "YA HAS VOTADO";
                    document.getElementById("statusMsg").innerText = "Tu apoyo ya fue registrado.";
                } else {
                    voteBtn.disabled = false;
                    voteBtn.innerText = "VOTAR AHORA";
                }
            } else {
                document.getElementById("statusMsg").innerText = "CARGANDO... (Configura desde Admin)";
            }
        });

        async function handleVote() {
            if (!eventActive) return;
            const voteBtn = document.getElementById("voteBtn");
            voteBtn.disabled = true;
            voteBtn.innerText = "REGISTRANDO...";

            try {
                await db.runTransaction(async (transaction) => {
                    const sfDoc = await transaction.get(docRef);
                    if (!sfDoc.exists) throw "El documento no existe.";

                    const data = sfDoc.data();
                    let voters = data.voters || [];
                    let votes = data.votes || 0;

                    if (voters.includes(userId)) {
                        throw "Ya has registrado tu voto anteriormente.";
                    }

                    voters.push(userId);
                    votes += 1;
                    const completed = votes >= 500;

                    transaction.update(docRef, { votes: votes, voters: voters, completed: completed });
                });

                document.getElementById("statusMsg").innerText = "¡Voto registrado con éxito!";
                triggerConfetti();
            } catch (error) {
                console.error(error);
                alert("Error: " + (error.message || error));
                voteBtn.disabled = false;
                voteBtn.innerText = "VOTAR AHORA";
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
