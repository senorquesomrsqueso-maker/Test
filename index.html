<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blood Strike LATAM - Revelación</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #07090e;
      --card-bg: #0d111a;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0055;
      --accent-red: #ff3344;
      --radius-ui: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .flash-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    .flash-overlay.active { opacity: 1; }

    #burstCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      margin: 0 auto;
    }

    /* ENCABEZADO MULTIPLATAFORMA */
    .header-ui {
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      width: 100%;
      margin-top: 5px;
    }

    .tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      opacity: 0.9;
      display: block;
      margin-bottom: 6px;
    }

    .timer {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.3rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(13, 17, 26, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 24px;
      border-radius: var(--radius-ui);
      display: inline-block;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    /* BANNERS DE ESTADO PROFESIONALES */
    .status-banner {
      position: absolute;
      top: 4%;
      left: 0;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 30;
      padding: 0 15px;
    }

    .status-banner.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .banner-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .banner-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
    }

    .success-mode .banner-badge {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .success-mode .banner-title { text-shadow: 0 0 25px rgba(0,240,255,0.6); }

    .failed-mode .banner-badge { color: var(--accent-red); }
    .failed-mode .banner-title { color: #ff4d4d; text-shadow: 0 0 25px rgba(255,51,68,0.5); }

    /* CARTA 3D ADAPTADA A PC Y MÓVIL */
    .stage {
      perspective: 1200px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .card-wrapper {
      width: clamp(220px, 45vh, 270px);
      aspect-ratio: 1 / 1.55;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatSmooth 4s ease-in-out infinite;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotateX(4deg) rotateY(-2deg); }
      50% { transform: translateY(-10px) rotateX(-4deg) rotateY(2deg); }
    }

    .card-wrapper.flipped {
      animation: floatFlipped 4s ease-in-out infinite 1.2s !important;
      transform: scale(1.05) rotateY(180deg) !important;
    }

    @keyframes floatFlipped {
      0%, 100% { transform: scale(1.05) rotateY(180deg) translateY(0px); }
      50% { transform: scale(1.05) rotateY(184deg) translateY(-8px); }
    }

    .card-wrapper.failed-state {
      animation: none !important;
      transform: scale(0.95) rotateX(10deg);
      filter: grayscale(40%) brightness(0.7);
      transition: all 0.8s ease;
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: var(--radius-ui);
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: var(--card-bg);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-back { transform: rotateY(0deg); }
    .card-front { transform: rotateY(180deg); }

    /* PANEL DE VOTACIÓN PROFESIONAL */
    .vote-ui {
      width: 100%;
      background: rgba(13, 17, 26, 0.75);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-ui);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      margin-bottom: 5px;
    }

    .progress-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .votes-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .votes-highlight {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      font-weight: 900;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .btn-vote {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #07090e;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(0, 240, 255, 0.35);
    }

    .btn-vote:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-vote:active { transform: scale(0.98); }

    .fade-out {
      opacity: 0 !important;
      transform: translateY(15px) !important;
      pointer-events: none !important;
    }

    /* BOTONES DE PRUEBA (ESQUINA INFERIOR DERECHA) */
    .test-box {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 6px;
    }

    .btn-test {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #94a3b8;
      padding: 6px 10px;
      font-size: 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-family: 'Orbitron', sans-serif;
      transition: all 0.2s;
    }
    .btn-test:hover { background: rgba(255,255,255,0.2); color: #fff; }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div id="flashOverlay" class="flash-overlay"></div>
  <canvas id="burstCanvas"></canvas>

  <!-- BANNER DE ÉXITO -->
  <div id="successBanner" class="status-banner success-mode">
    <span class="banner-badge">● LEGADO DESBLOQUEADO ●</span>
    <h1 class="banner-title">JHODA HA RESPONDIDO</h1>
  </div>

  <!-- BANNER DE FRACASO -->
  <div id="failedBanner" class="status-banner failed-mode">
    <span class="banner-badge">● TIEMPO AGOTADO ●</span>
    <h1 class="banner-title">NO SE CUMPLIÓ CON LA META</h1>
  </div>

  <div class="app-container">
    
    <!-- HEADER -->
    <header id="headerUI" class="header-ui">
      <span class="tag">BLOOD STRIKE LATAM</span>
      <div id="timer" class="timer">05:00:00</div>
    </header>

    <!-- CARTA 3D -->
    <div class="stage">
      <div id="cardWrapper" class="card-wrapper">
        <div class="card-face card-back">
          <img src="1000013129.png" alt="Card Back">
        </div>
        <div class="card-face card-front">
          <img src="1000013137.png" alt="Jhoda Card">
        </div>
      </div>
    </div>

    <!-- PANEL DE VOTACIÓN Y BARRA -->
    <div id="voteUI" class="vote-ui">
      <div class="progress-info">
        <div class="votes-display">
          <span>META DE COMUNIDAD</span>
          <span><strong id="currentVotes" class="votes-highlight">0</strong> / 500</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
      <button id="btnVote" class="btn-vote" onclick="vote(1)">VOTAR AHORA</button>
    </div>

  </div>

  <!-- BOTONES DE PRUEBA RÁPIDA -->
  <div class="test-box">
    <button class="btn-test" onclick="vote(100)">⚡ Éxito (+100)</button>
    <button class="btn-test" onclick="simulateTimeOut()">⌛ No Meta</button>
  </div>

  <script>
    let votes = 0;
    const targetVotes = 500;
    let isGameOver = false;

    function vote(amount) {
      if (isGameOver) return;

      votes += amount;
      if (votes > targetVotes) votes = targetVotes;

      document.getElementById('currentVotes').innerText = votes;
      const progressPercent = (votes / targetVotes) * 100;
      document.getElementById('progressBar').style.width = progressPercent + '%';

      if (votes >= targetVotes) {
        completeGoal();
      }
    }

    function completeGoal() {
      isGameOver = true;
      document.getElementById('headerUI').classList.add('fade-out');
      document.getElementById('voteUI').classList.add('fade-out');

      const flash = document.getElementById('flashOverlay');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 500);

      triggerParticleBurst();

      setTimeout(() => {
        document.getElementById('cardWrapper').classList.add('flipped');
      }, 250);

      setTimeout(() => {
        document.getElementById('successBanner').classList.add('show');
      }, 600);
    }

    function simulateTimeOut() {
      if (isGameOver) return;
      isGameOver = true;

      document.getElementById('headerUI').classList.add('fade-out');
      document.getElementById('voteUI').classList.add('fade-out');

      document.getElementById('timer').innerText = "00:00:00";
      document.getElementById('cardWrapper').classList.add('failed-state');

      setTimeout(() => {
        document.getElementById('failedBanner').classList.add('show');
      }, 400);
    }

    let totalSeconds = 5 * 3600;
    function updateTimer() {
      if (isGameOver) return;
      
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const fmt = (n) => String(n).padStart(2, '0');
      
      document.getElementById('timer').innerText = `${fmt(h)}:${fmt(m)}:${fmt(s)}`;
      
      if (totalSeconds > 0) {
        totalSeconds--;
      } else {
        if (votes < targetVotes) {
          simulateTimeOut();
        }
      }
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    const canvas = document.getElementById('burstCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticleBurst() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 1,
          color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055',ymers: 1,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
      animateBurst();
    }

    function animateBurst() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha > 0) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          particles.splice(index, 1);
        }
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateBurst);
      }
    }
  </script>
</body>
  </html>
