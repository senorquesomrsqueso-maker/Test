<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blood Strike LATAM - Revelación</title>
  
  <!-- Tipografía Limpia & Gamer Profesional -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #07090e;
      --card-bg: #0d111a;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0055;
      --text-muted: #64748b;
      --radius-ui: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
      overflow: hidden;
      position: relative;
    }

    /* Fondo con cuadrícula ultra limpia estilo cyberpunk minimalista */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    /* Destello de fondo al completar */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.5s ease;
    }
    .flash-overlay.active {
      opacity: 1;
    }

    /* Canvas para ráfaga de partículas */
    #burstCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* Layout Principal */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      padding: 10px 0;
    }

    /* --- ENCABEZADO --- */
    .header-ui {
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
      width: 100%;
    }

    .tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      opacity: 0.9;
      display: block;
      margin-bottom: 6px;
    }

    .timer {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(13, 17, 26, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 20px;
      border-radius: var(--radius-ui);
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* --- BANNER META CUMPLIDA (Posicionado para móviles sin cortarse) --- */
    .meta-banner {
      position: absolute;
      top: 5%;
      left: 0;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 30;
      padding: 0 15px;
    }

    .meta-banner.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .meta-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .meta-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(0,240,255,0.5);
    }

    /* --- ESCENA CARTA 3D --- */
    .stage {
      perspective: 1000px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .card-wrapper {
      width: clamp(230px, 62vw, 280px);
      aspect-ratio: 1 / 1.55;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatSmooth 4s ease-in-out infinite;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px) rotateX(4deg) rotateY(-2deg); }
      50% { transform: translateY(-12px) rotateX(-4deg) rotateY(2deg); }
    }

    /* Giro de la carta al completar */
    .card-wrapper.flipped {
      animation: floatFlipped 4s ease-in-out infinite 1.2s !important;
      transform: scale(1.08) rotateY(180deg) !important;
    }

    @keyframes floatFlipped {
      0%, 100% { transform: scale(1.08) rotateY(180deg) translateY(0px); }
      50% { transform: scale(1.08) rotateY(184deg) translateY(-10px); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--card-bg);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-back {
      transform: rotateY(0deg);
    }

    .card-front {
      transform: rotateY(180deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 0, 85, 0.4);
    }

    /* --- BOTÓN Y BARRA DE PROGRESO --- */
    .vote-ui {
      width: 100%;
      background: rgba(13, 17, 26, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.5s ease, transform 0.5s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .progress-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .votes-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .votes-highlight {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      font-weight: 900;
    }

    /* Barra de progreso limpia */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    /* Botón de Votar elegante */
    .btn-vote {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      color: #07090e;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
    }

    .btn-vote:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 240, 255, 0.2);
    }

    /* Ocultar interfaz al completar */
    .fade-out {
      opacity: 0 !important;
      transform: translateY(20px) !important;
      pointer-events: none !important;
    }

    /* Botón de prueba en esquina */
    .btn-test {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 5px 10px;
      font-size: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div id="flashOverlay" class="flash-overlay"></div>
  <canvas id="burstCanvas"></canvas>

  <!-- BANNER META CUMPLIDA -->
  <div id="metaBanner" class="meta-banner">
    <span class="meta-badge">● LEGADO DESBLOQUEADO ●</span>
    <h1 class="meta-title">JHODA HA RESPONDIDO</h1>
  </div>

  <div class="app-container">
    
    <!-- HEADER -->
    <header id="headerUI" class="header-ui">
      <span class="tag">BLOOD STRIKE LATAM</span>
      <div id="timer" class="timer">05:00:00</div>
    </header>

    <!-- MESA / CARTA 3D -->
    <div class="stage">
      <div id="cardWrapper" class="card-wrapper">
        <!-- Reverso (Carta azul) -->
        <div class="card-face card-back">
          <img src="1000013129.png" alt="Card Back">
        </div>
        <!-- Frente (Jhoda) -->
        <div class="card-face card-front">
          <img src="1000013137.png" alt="Jhoda Card">
        </div>
      </div>
    </div>

    <!-- PANEL DE VOTACIÓN Y BARRA -->
    <div id="voteUI" class="vote-ui">
      <div class="progress-info">
        <div class="votes-display">
          <span>META DE COMUNIDAD</span>
          <span><strong id="currentVotes" class="votes-highlight">0</strong> / 500</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
      <button id="btnVote" class="btn-vote" onclick="vote(1)">VOTAR AHORA</button>
    </div>

  </div>

  <!-- BOTÓN DE PRUEBA -->
  <button class="btn-test" onclick="vote(100)">⚡ Test +100</button>

  <script>
    let votes = 0;
    const targetVotes = 500;
    let isCompleted = false;

    function vote(amount) {
      if (isCompleted) return;

      votes += amount;
      if (votes > targetVotes) votes = targetVotes;

      // Actualizar UI de votos
      document.getElementById('currentVotes').innerText = votes;
      const progressPercent = (votes / targetVotes) * 100;
      document.getElementById('progressBar').style.width = progressPercent + '%';

      if (votes >= targetVotes) {
        completeGoal();
      }
    }

    function completeGoal() {
      isCompleted = true;

      // 1. Ocultar suavemente header y panel de votos
      document.getElementById('headerUI').classList.add('fade-out');
      document.getElementById('voteUI').classList.add('fade-out');

      // 2. Destello visual (Flash shockwave)
      const flash = document.getElementById('flashOverlay');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 600);

      // 3. Ráfaga de partículas de luz
      triggerParticleBurst();

      // 4. Girar carta en 3D
      setTimeout(() => {
        document.getElementById('cardWrapper').classList.add('flipped');
      }, 300);

      // 5. Mostrar banner superior bien posicionado
      setTimeout(() => {
        document.getElementById('metaBanner').classList.add('show');
      }, 700);
    }

    // --- CRONÓMETRO ---
    let totalSeconds = 5 * 3600;
    function updateTimer() {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const fmt = (n) => String(n).padStart(2, '0');
      document.getElementById('timer').innerText = `${fmt(h)}:${fmt(m)}:${fmt(s)}`;
      if (totalSeconds > 0) totalSeconds--;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // --- EFECTO DE RÁFAGA DE PARTÍCULAS ---
    const canvas = document.getElementById('burstCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticleBurst() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055',
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
      animateBurst();
    }

    function animateBurst() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha > 0) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else {
          particles.splice(index, 1);
        }
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateBurst);
      }
    }
  </script>
</body>
</html>
